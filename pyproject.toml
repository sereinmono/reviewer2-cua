[project]
name = "nano-cua-lab"
version = "0.1.0"
description = "Consolidated plugin groups and experiment records around the nano-cua base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["extensions", "experiments"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["extensions/tests", "experiments/tests"]
