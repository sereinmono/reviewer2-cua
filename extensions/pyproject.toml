[project]
name = "nano-cua-extensions"
version = "0.1.0"
description = "Optional compatibility groups and model adapters for nano-cua: Playwright browser group, generic VLM actor, demo CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "nano-cua",
]

[project.scripts]
nano-cua-demo = "nano_cua_extensions.demo_cli:main"

[tool.uv.sources]
nano-cua = { path = "../../nano-cua", editable = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
